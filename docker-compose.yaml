services:
  # PostgreSQL database
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-net

  # Spring Boot backend
  backend:
    build:
      context: ./backend/The-Film-Roulette
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - backend-net
    env_file:
      - .env

  # Vite/React frontend (built + served by nginx)
  frontend:
    image: the-film-roulette-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: >
      sh -lc "
      DEPS_HASH=\"$$(node -e \"const fs=require('fs');const crypto=require('crypto');const files=['package.json','package-lock.json'];const h=crypto.createHash('sha256');for (const f of files){ if (fs.existsSync(f)) h.update(fs.readFileSync(f)); }process.stdout.write(h.digest('hex'));\")\";
      if [ ! -d node_modules ] || [ -z \"$$(ls -A node_modules 2>/dev/null)\" ] || [ ! -f node_modules/.deps_hash ] || [ \"$$(cat node_modules/.deps_hash 2>/dev/null)\" != \"$$DEPS_HASH\" ]; then
        npm install;
        echo \"$$DEPS_HASH\" > node_modules/.deps_hash;
      fi;
      npm run dev -- --host 0.0.0.0 --port 5173
      "
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - backend-net

volumes:
  db_data:
  frontend_node_modules:

networks:
  backend-net:
