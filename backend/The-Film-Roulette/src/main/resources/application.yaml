spring:
  application:
    name: The-Film-Roulette

  datasource:
    # In Railway/Render, you may get DATABASE_URL (postgres://...) instead of SPRING_DATASOURCE_URL.
    # A startup post-processor converts postgres://... to jdbc:postgresql://...
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
    
jwt:
  secret: ${JWT_SECRET}

tmdb:
  api:
    key: ${TMDB_API_KEY}

cors:
  urls: ${CORS_URLS:http://localhost:5173}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
