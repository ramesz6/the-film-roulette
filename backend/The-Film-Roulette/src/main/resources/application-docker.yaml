spring:
  config:
    activate:
      on-profile: docker

  sql:
    init:
      mode: always
      # schema.sql includes a backward-compatibility patch that may no-op on fresh databases.
      # If init order changes and the table doesn't exist yet, don't fail startup.
      continue-on-error: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
