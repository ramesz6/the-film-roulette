spring:
  config:
    activate:
      on-profile: docker

  sql:
    init:
      # Disable schema.sql execution in docker.
      # The legacy ListStatus constraint patch is applied deterministically at startup
      # (after JPA schema creation) by a Java patcher that can safely handle missing tables.
      mode: never

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
