services:
  # Dev frontend: Vite + HMR (no rebuild needed on code changes)
  frontend:
    image: the-film-roulette-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -lc "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci || npm install; fi; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_DEV_PORT:-5174}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
