# Setup an action to run the frontend CI for PRs

# name of the action
name: Frontend CI

# when should it run
on:
  pull_request:
    branches:
      - main

# what should it do
jobs:
  # name of the job
  build:
    # what should it run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # default values for all the steps
    defaults:
      run:
        working-directory: repo/frontend
    steps:
      - name: Download source (no git)
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          URL="https://codeload.github.com/${{ github.repository }}/tar.gz/${SHA}"

          echo "Downloading ${URL}"
          for i in 1 2 3 4 5; do
            if curl -fsSL "${URL}" -o src.tgz; then
              break
            fi
            echo "Download failed; retrying in $((i * 10))s..."
            sleep "$((i * 10))"
          done

          mkdir -p repo
          tar -xzf src.tgz -C repo --strip-components=1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build
      # - name: Run tests
      #   run: npm test
      - name: Run formatter + linter
        run: npm run check